<div class="auth-page">
  <header class="auth-header">
    <a href="/" class="logo">
      <img src="/logo-dgtu.png" alt="Логотип ДГТУ">
      <span>
        <strong>ДОНСКОЙ ГОСУДАРСТВЕННЫЙ</strong>
        <strong>ТЕХНИЧЕСКИЙ УНИВЕРСИТЕТ</strong>
      </span>
    </a>

    <a href="/" class="back-link">← На главную</a>
  </header>

  <main class="auth-main">
    <section class="auth-card">
      <span class="auth-label">ЭЛЕКТРОННЫЕ СЕРВИСЫ ДГТУ</span>

      <h1>Вход в систему</h1>

      <p class="auth-description">
        Войдите в личный кабинет, чтобы записаться
        на приём в деканат.
      </p>

      <form>
        <div class="form-group">
          <label for="email">Электронная почта</label>
          <input
            type="email"
            id="email"
            placeholder="Введите вашу почту"
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label for="password">Пароль</label>
          <input
            type="password"
            id="password"
            placeholder="Введите пароль"
            autocomplete="current-password"
          >
        </div>

        <button type="submit" class="submit-button">
          Войти
        </button>
      </form>

      <p class="auth-switch">
        Ещё нет аккаунта?
        <a href="/register">Зарегистрироваться</a>
      </p>
    </section>
  </main>

  <footer class="auth-footer">
    Донской государственный технический университет
  </footer>
</div>
