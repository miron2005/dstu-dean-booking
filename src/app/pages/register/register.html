
<div class="auth-page">
  <header class="auth-header">
    <a routerLink="/" class="logo">
      <img src="/logo-dgtu.png" alt="Логотип ДГТУ">

      <span>
        <strong>ДОНСКОЙ ГОСУДАРСТВЕННЫЙ</strong>
        <strong>ТЕХНИЧЕСКИЙ УНИВЕРСИТЕТ</strong>
      </span>
    </a>

    <a routerLink="/" class="back-link">← На главную</a>
  </header>

  <main class="auth-main">
    <section class="auth-card">
      <span class="auth-label">ЭЛЕКТРОННЫЕ СЕРВИСЫ ДГТУ</span>

      <h1>Регистрация</h1>

      <p class="auth-description">
        Создайте учётную запись студента,
        чтобы записываться на приём в деканат.
      </p>

      <form>
        <div class="form-group">
          <label for="full_name">ФИО</label>
          <input
            type="text"
            id="full_name"
            placeholder="Иванов Иван Иванович"
            autocomplete="name"
          >
        </div>

        <div class="form-group">
          <label for="email">Электронная почта</label>
          <input
            type="email"
            id="email"
            placeholder="example@mail.ru"
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label for="faculty">Факультет</label>
          <select id="faculty">
            <option value="" disabled selected>
              Выберите факультет
            </option>
          </select>
        </div>

        <div class="form-group">
          <label for="password">Пароль</label>
          <input
            type="password"
            id="password"
            placeholder="Придумайте пароль"
            autocomplete="new-password"
          >
        </div>

        <div class="form-group">
          <label for="confirm_password">Повторите пароль</label>
          <input
            type="password"
            id="confirm_password"
            placeholder="Повторите пароль"
            autocomplete="new-password"
          >
        </div>

        <button type="submit" class="submit-button">
          Зарегистрироваться
        </button>
      </form>

      <p class="auth-switch">
        Уже есть аккаунт?
        <a routerLink="/login">Войти</a>
      </p>
    </section>
  </main>

  <footer class="auth-footer">
    Донской государственный технический университет
  </footer>
</div>
